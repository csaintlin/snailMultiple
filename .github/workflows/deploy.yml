name: 🚀 Deploy to GitHub Pages

on:
  push:
    branches:
      - main   # 每次推送到 main 分支時自動觸發部署

  # 也允許在 GitHub 網頁上手動觸發
  workflow_dispatch:

# 設定 GitHub Pages 部署所需的權限
permissions:
  contents: read
  pages: write
  id-token: write

# 避免多個部署同時執行互相衝突
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 📦 Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          # 如果你的 repo 名稱不是 snailMultiple，請在這裡修改
          VITE_BASE_URL: /snailMultiple/

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 🌐 Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
